name: publish
on:
  push:
    tags: ['*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      audience: https://hub.1cdevelopers.ru
      hub: https://hub.1cdevelopers.ru
      pool: default
      package: changelog-reader
    steps:
      - uses: actions/checkout@v4
      - uses: otymko/setup-onescript@v1.5.1
        with:
          version: stable
      - run: opm install opm@1.6.5
      - run: opm install -l && opm build .
      - name: push
        run: |
          id_token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          file=$(ls ${package}-*.ospx | head -n 1)
          curl -sSf -X POST "$hub/api/v1/pools/$pool/push" \
            -H "OAUTH-TOKEN: $id_token" \
            -H "FILE-NAME: $(basename $file)" \
            --data-binary "@$file"
